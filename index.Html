<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MJF Center Visit Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>MJF Skill Allied Service</h1>
            <h2>Training Center, Patna</h2>
            <p>Center Visit Form</p>
        </div>

        <form id="visitForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <div class="row">

                <div class="form-group">
                    <label for="age">Age</label>
                    <input 
                        type="number" 
                        id="age" 
                        name="age"
                        placeholder="Enter age"
                        min="1"
                        max="100"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="qualification">Qualification</label>
                    <select id="qualification" name="qualification" required>
                        <option value="">Select Qualification</option>
                        <option value="10th">10th</option>
                        <option value="12th">12th</option>
                        <option value="ITI">ITI</option>
                        <option value="Diploma">Diploma</option>
                        <option value="Graduation">Graduation</option>
                        <option value="Post Graduation">Post Graduation</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label for="district">District</label>
                <input 
                    type="text" 
                    id="district" 
                    name="district"
                    placeholder="Enter your district"
                    required
                >
            </div>

            <div class="form-group">
                <label for="purpose">Purpose of Visit</label>
                <textarea 
                    id="purpose" 
                    name="purpose"
                    placeholder="Why are you visiting our center?"
                    rows="3"
                ></textarea>
            </div>

            <div class="form-group">
                <label for="course">Course / Training Interested In</label>
                <input 
                    type="text" 
                    id="course" 
                    name="course"
                    placeholder="Enter course or training name"
                >
            </div>

            <div class="form-group">
                <label for="feedback">Message / Feedback</label>
                <textarea 
                    id="feedback" 
                    name="feedback"
                    placeholder="Enter your feedback"
                    rows="4"
                ></textarea>
            </div>

            <button type="submit">
                Submit Form
            </button>

            <div id="successMessage" class="success-message"></div>

        </form>

        <div class="footer">
            <h3>Thanks for visiting!</h3>

            <p>
                MJF Skill Allied Service Training Center, Patna
            </p>

            <p>
                We appreciate your visit and interest in our training programs.
            </p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
